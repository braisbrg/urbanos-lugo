# The Worker that answers /api/* for the published site. See worker/index.ts.
#
# ALLOWED_ORIGIN is deliberately not set here: it names the one site allowed to call this,
# and it belongs to whoever deploys it. Set it once with
#   pnpm dlx wrangler secret put ALLOWED_ORIGIN
# or in the dashboard. Without it the Worker answers with an empty allow-origin, which the
# browser refuses -- failing closed rather than open.
name = "urbanos-lugo-api"
main = "index.ts"
compatibility_date = "2026-09-03"

# So `fetch`, `Response` and `TextDecoder` behave the way src/services/ expects, which is
# how those files run unchanged in both this and server.ts.
compatibility_flags = ["nodejs_compat"]

# Free plan: 100,000 requests a day. With the edge cache in index.ts holding notices for
# thirty minutes and a stop's minutes for twenty seconds, the outbound count stays near
# one per window however many people are looking.
[observability]
enabled = true
