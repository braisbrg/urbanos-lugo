name: Deploy to GitHub Pages

# Pushes deploy the app. The schedule re-deploys with a fresh snapshot of the operator's
# service notices, which is the only piece of data that changes on its own — the browser
# cannot fetch buslugo.com directly because of CORS, and a static host has no server to
# do it at runtime.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # hourly, off the hour to avoid the busiest minute
  workflow_dispatch:

# Least privilege at the top, then each job asks for what it needs. The build job
# reads the tree and nothing more; only the deploy job may write to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Without this the token stays in .git/config for every later step, where a
      # compromised dependency's install script could read it. Nothing here pushes.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No version here on purpose: the action reads `packageManager` from
      # package.json, so a laptop and this workflow can never drift apart.
      - uses: pnpm/action-setup@v4

      # A postinstall is where a compromised dependency runs first. pnpm-workspace.yaml names
      # the only package allowed one (esbuild, which needs it to place its binary);
      # everything else is blocked without having to remember a flag here.
      - run: pnpm install --frozen-lockfile

      # Never publish a build whose data contradicts itself, or whose times claim to be
      # something they are not.
      - run: pnpm run lint
      - run: pnpm test

      # Best effort: if buslugo.com is unreachable the committed snapshot is used as is.
      - name: Refresh service notices
        run: pnpm exec tsx tools/fetchAlerts.ts || echo "notice refresh failed, keeping the committed snapshot"

      # Project sites live at https://<user>.github.io/<repo>/. For a user site or a
      # custom domain, set BASE_PATH to "/" and SITE_URL to that domain.
      #
      # Both are derived in the shell from GITHUB_REPOSITORY ("owner/name"), which every
      # workflow run has whatever triggered it, rather than from the webhook payload,
      # whose shape differs between a push, a schedule and a manual run. An empty value
      # would put every asset under "//" -- and the hourly run is the one that would show
      # it, days after the push that looked fine.
      #
      # SITE_URL is what emits the canonical link, robots.txt and sitemap.xml; they are
      # left out entirely when it is unset, because pointing a crawler at the wrong origin
      # is worse than pointing it nowhere.
      #
      # VITE_API_ORIGIN says where /api/… lives when it does not live beside the page.
      # Empty unless the repository variable API_ORIGIN is set (Settings → Secrets and
      # variables → Actions → Variables), and empty is the behaviour without a Worker: no
      # endpoints, the committed snapshot of the notices, and no operator block behind the
      # QR. Set it to a deployed Worker's address and the build both calls it and admits
      # exactly that origin in the policy. A variable rather than a line of code, because
      # it is the address of somebody's deployment and not a fact about this project.
      - name: Build
        env:
          VITE_API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          export SITE_URL="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "building for $SITE_URL"
          pnpm run build

      # Stops GitHub Pages from running Jekyll over the output.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
