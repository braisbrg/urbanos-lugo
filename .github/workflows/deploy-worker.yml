name: Deploy the API worker

# The two endpoints a static host cannot serve: the operator's service notices and the
# minutes their own page shows behind a pole's QR. Neither site sends a CORS header, so a
# browser is refused and something with a server has to ask for it.
#
# It only exists if somebody deploys it. Without it the site is exactly what it is today:
# the notices come from the copy the hourly job commits, and the QR block does not appear.
# So this workflow does nothing at all until DENO_DEPLOY_TOKEN is set as a repository
# secret — no red runs on a repository that has decided not to bother.
on:
  push:
    branches: [main]
    # Only when something it is made of changed. The app's own screens are Pages' business.
    paths:
      - 'worker/**'
      - 'src/services/**'
      - 'src/data/**'
      - 'src/utils/**'
      - 'src/project.ts'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Exchanged for a short-lived credential at deploy time; nothing long-lived is stored.
  id-token: write

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Read here and not in the step's `if`: the secrets context is available to a job's
      # env and not to a step's condition, where it would quietly evaluate to nothing and
      # skip the deploy on a repository that had configured one.
      HAS_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      # The same gate the site gets. A worker that answers with a dataset contradicting
      # itself is worse than one that is not there, because the app has a fallback for
      # absent and none for wrong.
      - run: pnpm run lint
      - run: pnpm test

      # Deno needs explicit extensions in relative imports and every file under src/ is
      # written for a bundler, so the worker is bundled first. esbuild is already here for
      # server.ts; this adds no dependency.
      - run: pnpm run worker:build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `deno deploy`, not deployctl. Deploy Classic — the dash.deno.com generation this
      # workflow was first written against — was shut down on 20 July 2026, and deployctl
      # along with it. The new platform calls the unit an *app* rather than a project, so
      # `--project` is gone and `--app` replaces it, with `--org` naming the organisation.
      #
      # It deploys the working directory, so it runs from worker/dist — the one file
      # `worker:build` emits — rather than pushing the whole repository at it.
      #
      # `--json --non-interactive` are not decoration. The CLI's own help is explicit:
      # "For non-interactive use (CI, AI agents), authenticate via the DENO_DEPLOY_TOKEN
      # env var (or --token) and pass --json --non-interactive to every subcommand."
      # Without them it tries to prompt, finds no terminal, and fails.
      #
      # The `--` is load-bearing, and cost a red run to find. `deno deploy --json …` puts
      # every flag through twice — deno's own parser takes them and forwards them as well
      # — and the deploy tool rejects the duplicate before it does anything else:
      # {"code":"VALIDATION_ERROR","message":"Option \"--json\" can only occur once"}.
      # It is not specific to --json; --org and --non-interactive duplicate the same way.
      # After `--`, deno stops reading and hands the rest over untouched.
      #
      # Checked against deno 2.9.6 by running this exact line with no token: it now gets
      # as far as asking for one, which is the furthest it can go without credentials.
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        working-directory: worker/dist
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          # Required, and it is the *slug*, not the name in the dashboard header. Those
          # differ here — the header reads "brais" and the slug is "braisbrg" — and a
          # mismatch comes back as NOT_FOUND with no hint as to what was expected. Leaving
          # it out is not an option either: the organisation resolves to '' and the tool
          # reports that an organisation called '' does not exist. `orgs list` below is
          # what prints the real slug.
          DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG }}
        # `set -x` so the log shows the exact line that ran. Two red runs went on guessing
        # what the shell had built; this makes the next one say.
        run: |
          set -x
          deno deploy -- --json --non-interactive --org "$DENO_DEPLOY_ORG" --app urbanos-lugo-api --prod

      # A NOT_FOUND on the organisation says what was not found and nothing about what
      # would have been. This turns the next red run into an answer instead of a guess.
      - name: Show what the token can actually reach
        if: failure() && env.HAS_TOKEN == 'true'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          # The subcommand goes BEFORE the separator: everything after `--` is an argument
          # to `deploy` itself, so `deploy -- orgs` asked it to deploy a directory named
          # orgs. And `orgs` is a group, so the leaf is `orgs list`.
          echo "--- organisations this token can see ---"
          deno deploy orgs list -- --json || true
          echo "--- who the token belongs to ---"
          deno deploy whoami -- --json || true

      - name: Say why nothing was deployed
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "No DENO_DEPLOY_TOKEN secret, so there is nothing to deploy to."
          echo "The site does not need this: without the worker the notices come from the"
          echo "committed snapshot and the QR block stays hidden, which is the published"
          echo "behaviour today. README, 'Devolverlle a Pages as dúas cousas que lle faltan'."
