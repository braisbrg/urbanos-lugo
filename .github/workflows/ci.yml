name: Checks

# The same two gates the deployment runs, but on the proposal rather than after it.
#
# Everything else here triggers on a push to main, which means a pull request arrived with
# nothing checked and the first evidence came from production. That is backwards for the
# pull requests this repository actually gets: Dependabot's, where the whole question is
# whether a version bump still builds and still agrees with the operator's data.
#
# Deliberately not the deployment: a pull request must never publish. This runs the same
# `lint` and `test` and stops there.
on:
  pull_request:
    branches: [main]
  # And on a branch that is not main, so work in progress is checked before it becomes a
  # pull request at all.
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm test

      # The checks that were written and then never run by anything.
      #
      # Three tools under tools/ walk the whole dataset rather than a sample — 180,144
      # boards and 401,109 departures for the invariants, 630 origin/destination pairs and
      # 27,348 journeys for the planner — and each sets a failing exit code when something
      # does not hold. None of them was referenced by a script, a workflow or another file,
      # so nothing had run them since they were written, and a check nobody runs is a file.
      # Twenty-four seconds, measured, for coverage `pnpm test` cannot reach.
      #
      # Two more stay out on purpose: stressHttp needs a server listening, and
      # compareOperatorTimes reads the operator's own site — which is not a thing to do to
      # somebody else's server on every push. Both have scripts instead.
      - run: pnpm run check:deep

      # A dependency bump that breaks the build is the failure this is here to catch, and
      # `pnpm test` does not compile anything.
      - run: pnpm run build
