version: 2

# Eighteen direct dependencies and a lockfile nobody looks at until something breaks.
# This is what keeps a security advisory from sitting unread for six months.
updates:
  - package-ecosystem: npm # covers pnpm; the lockfile is pnpm-lock.yaml
    directory: /
    # Against develop, where work lands: a bump merged into main would leave main with a
    # commit develop lacks, and the next `git push origin develop:main` would be refused.
    # GitHub applies this to version updates only; a security-fix PR still opens against
    # main and is retargeted by hand (`gh pr edit <n> --base develop`).
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for the routine bumps, so review effort goes to the ones that matter.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Every action is pinned to a commit SHA, with its version in a comment beside it. A
    # tag can be moved to other code after it was reviewed, and denoland/setup-deno -- the
    # outside action this note once said would be the time to pin -- was not even a tag
    # but a branch. Dependabot understands the pin and the comment, and moves both
    # together in the pull request it opens.
    open-pull-requests-limit: 3
